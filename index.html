<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltra AI - Yapay Zeka Asistanı</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            background-color: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .chat-header {
            background-color: #0f172a;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
        }
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 14px;
        }
        .ai-msg {
            background-color: #334155;
            align-self: flex-start;
            color: #cbd5e1;
        }
        .user-msg {
            background-color: #0284c7;
            align-self: flex-end;
            color: white;
        }
        .chat-input {
            display: flex;
            padding: 12px;
            background-color: #0f172a;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Veltra AI Asistan</div>
        <div id="chat-messages">
            <div class="msg ai-msg">Merhaba! Ben Veltra AI. Sana nasıl yardımcı olabilirim?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Bir şeyler yaz..." onkeypress="handleKeyPress(event)">
            <button onclick="sendChat()">Gönder</button>
        </div>
    </div>

    <script>
        function sendChat() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;
            
            const chatMsgs = document.getElementById('chat-messages');
            
            // Kullanıcı mesajını ekle
            chatMsgs.innerHTML += `<div class="msg user-msg">${text}</div>`;
            input.value = '';
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            // Yapay zeka yanıt simülasyonu
            setTimeout(() => {
                let reply = "Harika bir soru! Bu konuda sana memnuniyetle yardımcı olurum.";
                const lower = text.toLowerCase();
                
                if(lower.includes("merhaba") || lower.includes("selam")) {
                    reply = "Selam! Bugün hangi projeler üzerinde çalışıyoruz?";
                } else if(lower.includes("nasıl") || lower.includes("ne")) {
                    reply = "Kod yazımında ve hata ayıklamada her zaman yanındayım.";
                } else if(lower.includes("oyun")) {
                    reply = "Oyun projeleri geliştirmek oldukça eğlencelidir! Hangi tür oyun yapıyorsun?";
                }

                chatMsgs.innerHTML += `<div class="msg ai-msg">${reply}</div>`;
                chatMsgs.scrollTop = chatMsgs.scrollHeight;
            }, 600);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendChat();
            }
        }
    </script>
</body>
</html>
