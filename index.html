<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltra AI - Çok Amaçlı Medya Platformu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: var(--text-sub);
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: #38bdf8;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Sohbet Alanı */
        #chat-messages {
            height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }

        .ai-msg {
            background-color: #334155;
            align-self: flex-start;
            color: #e2e8f0;
        }

        .user-msg {
            background-color: var(--accent-color);
            align-self: flex-end;
            color: white;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="file"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: white;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Fotoğraf/Görsel Alanı */
        .image-preview-container {
            width: 100%;
            height: 180px;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: var(--bg-color);
            margin-bottom: 10px;
            position: relative;
        }

        .image-preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
