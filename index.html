<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Block Blast</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin: 5px; font-size: 24px; }
        #score { font-size: 18px; margin-bottom: 10px; color: #4ecca3; }
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 35px);
            grid-template-rows: repeat(8, 35px);
            gap: 2px;
            background-color: #162447;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .cell {
            width: 35px;
            height: 35px;
            background-color: #1f4068;
            border-radius: 3px;
        }
        .cell.filled {
            background-color: #e94560;
        }
        .tray {
            display: flex;
            gap: 15px;
            min-height: 80px;
            align-items: center;
        }
        .piece-container {
            background-color: #162447;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            display: grid;
            gap: 2px;
        }
        .piece-cell {
            width: 20px;
            height: 20px;
            background-color: #1f4068;
            border-radius: 2px;
        }
        .piece-cell.filled {
            background-color: #0f3460;
        }
        .selected {
            border: 2px solid #4ecca3;
        }
    </style>
</head>
<body>

    <h1>Block Blast Klonu</h1>
    <div id="score">Skor: 0</div>
    
    <div class="grid" id="grid"></div>
    <div class="tray" id="tray"></div>
