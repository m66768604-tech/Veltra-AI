<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltra AI Asistanı</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        .input-container {
            padding: 20px;
            background-color: #1e293b;
            display: flex;
            gap: 10px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>Veltra AI Asistanı</header>

    <div id="chat-container">
        <div class="message ai-message">Merhaba! Ben senin yapay zeka asistanınım. Sana nasıl yardımcı olabilirim?</div>
    </div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="Bir şeyler yaz..." autofocus>
        <button onclick="sendMessage()">Gönder</button> ak
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Kullanıcı mesajını ekle
            appendMessage(text, 'user-message');
            userInput.value = '';

            // Yapay zeka yanıt simülasyonu (Buraya kendi API anahtarını veya PuterJS entegrasyonunu bağlayabilirsin)
            setTimeout(() => {
                let reply = "Harika bir soru! Bunu senin için inceliyorum.";
                if (text.toLowerCase().contains("merhaba") || text.toLowerCase().includes("selam")) {
                    reply = "Aleykümselam! Projelerinde nasıl yardımcı olabilirim?";
                } else if (text.toLowerCase().includes("minecraft")) {
                    reply = "Minecraft sunucu yapılandırmaları ve eklentileri konusunda oldukça bilgiliyim!";
                }
                appendMessage(reply, 'ai-message');
            }, 600);
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
